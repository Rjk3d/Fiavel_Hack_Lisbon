  <script>
    (() => {
      const id = "s2-reveal";
      const cue = (t, e) => window.filmCue(id, t, e);
      const tl = gsap.timeline({ paused: true });
      // Frame the overview region x 520..1660, y 160..800 (screenshot px) in the 1425 px window.
      const S = 1425 / 1140;
      gsap.set("#s2-cam", { transformOrigin: "0 0", scale: S, x: -520 * S, y: -160 * S });

      // The mark is performed on the field S1 flooded: tile, shield, then the check is drawn.
      tl.fromTo("#s2-mark", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 0.15);
      tl.fromTo("#s2-shield", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.35);
      tl.to("#s2-check", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.6);
      tl.fromTo("#s2-word span", { opacity: 0.0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.09, ease: "power2.out" }, 0.75);
      tl.fromTo("#s2-tag span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.32, ease: "power2.out" }, cue("Fiável is building") + 0.1);

      // "It brings lease conditions...": the field shrinks into the app's own guarantee card.
      const carry = cue("It brings") - 0.55;
      tl.to("#s2-brand", { opacity: 0, filter: "blur(10px)", scale: 0.92, duration: 0.3, ease: "power2.in" }, carry);
      tl.fromTo("#s2-field", { clipPath: "inset(0% 0% 0% 0% round 0px)" },
        { clipPath: "inset(10.30% 42.58% 44.33% 14.32% round 35px)", duration: 0.65, ease: "power3.inOut" }, carry);
      tl.to("#s2-field", { opacity: 0, duration: 0.25, ease: "power1.out" }, carry + 0.62);
      tl.fromTo("#s2-src", { opacity: 0 }, { opacity: 1, duration: 0.3 }, carry + 0.7);

      // One focus at a time, on the word that names it.
      const marks = [["terms", "It brings lease"], ["pay", "payments"], ["dep", "deposit protection"], ["act", "and guided actions"]];
      marks.forEach(([k, t], i) => {
        const at = cue(t) + 0.05;
        tl.fromTo(`#s2-r-${k}`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(`#s2-c-${k}`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, at + 0.05);
        const next = i + 1 < marks.length ? cue(marks[i + 1][1]) : cue("and guided actions", 1) + 0.9;
        tl.to([`#s2-r-${k}`, `#s2-c-${k}`], { opacity: 0, duration: 0.15, ease: "power2.in" }, next - 0.1);
      });

      window.__timelines[id] = tl;
    })();
  </script>
