    (() => {
      const id = "s4-stellar";
      const cue = (t, e) => window.filmCue(id, t, e);

      const tl = gsap.timeline({ paused: true });
      const frame = (r, W) => { const s = W / r[2]; return { scale: s, x: -r[0] * s, y: -r[1] * s }; };

      // Opens on the activity where S3 left it, then the camera pushes through it to what lies underneath.

      // "LeaseVault": the contract lands.

      tl.fromTo(["#s4-sub", "#s4-id"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.25 }, cue("a Soroban") + 0.2);

      // "hold the rental guarantee": both parties, the asset, and funds moving into the contract.
      const hold = cue("It is designed");
      tl.fromTo(["#s4-tenant", "#s4-landlord"], { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.12, ease: "expo.out" }, hold);
      tl.fromTo("#s4-usdc", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, hold + 0.3);
      ["#s4-l1", "#s4-l2", "#s4-l3"].forEach((l, i) => tl.to(l, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, hold + 0.45 + i * 0.12));
      // A token of the funds travels tenant -> USDC -> LeaseVault (offsets from its base point).
      tl.fromTo("#s4-d1", { x: 0, y: 0, opacity: 0 }, { opacity: 1, duration: 0.15 }, hold + 1.0);
      tl.to("#s4-d1", { x: 80, y: 100, duration: 0.6, ease: "power1.inOut" }, hold + 1.05);
      tl.to("#s4-d1", { x: 390, y: 100, duration: 0.7, ease: "power1.inOut" }, hold + 1.65);
      tl.to("#s4-d1", { opacity: 0, duration: 0.2 }, hold + 2.35);

      // One rule per word: payments, claims, deadlines, releases.
      [["#s4-rule-1", "and enforce"], ["#s4-rule-2", "claims"], ["#s4-rule-3", "deadlines"], ["#s4-rule-4", "and releases"]].forEach(([r, t], i) => {
        const at = cue(t) + (i === 0 ? 1.6 : 0.05);
        tl.to(r, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
        tl.to(`${r} .k`, { color: "#6338b8", duration: 0.25 }, at);
      });

      // Allowed outcomes appear with "releases"; a disputed amount is the one case a person decides.
      const outs = cue("deadlines") + 0.1;
      tl.fromTo("#s4-out-h", { opacity: 0 }, { opacity: 1, duration: 0.25 }, outs);
      ["#s4-l4", "#s4-l5", "#s4-l6"].forEach((l, i) => tl.to(l, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, outs + i * 0.1));
      tl.fromTo(["#s4-o1", "#s4-o2", "#s4-o3"], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.12, ease: "expo.out" }, outs + 0.2);
      tl.fromTo("#s4-d2", { x: 0, y: 0, opacity: 0 }, { opacity: 1, duration: 0.15 }, outs + 0.5);
      tl.to("#s4-d2", { x: 62, y: -160, duration: 0.7, ease: "power1.inOut" }, outs + 0.55);
      tl.to("#s4-d2", { opacity: 0, duration: 0.2 }, outs + 1.25);

      // "When an action happens on-chain": the diagram steps back; the recorded transaction lands.
      const txIn = cue("When an action") + 0.2;
      tl.to("#s4-diagram", { opacity: 0.12, scale: 0.94, filter: "blur(6px)", duration: 0.45, ease: "power2.inOut", transformOrigin: "50% 50%" }, txIn);
      tl.fromTo("#s4-tx", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, txIn + 0.15);

      const back = cue("its transaction", 1) + 0.5;
      tl.set("#s4-act-cam", { ...frame([548, 900, 840, 472], 1425) }, back + 0.2);
      tl.to("#s4-tx", { scale: 0.6, opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power3.in", transformOrigin: "50% 60%" }, back);
      tl.fromTo("#s4-act", { scale: 0.92, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out", immediateRender: false }, back + 0.25);
      tl.fromTo("#s4-r-row", { opacity: 0 }, { opacity: 1, duration: 0.3 }, back + 0.9);
      tl.fromTo("#s4-src", { opacity: 0 }, { opacity: 1, duration: 0.3 }, back + 0.3);
      tl.to("#s4-act-cam", { ...frame([560, 960, 780, 439], 1425), duration: D - back - 1.2, ease: "power1.inOut" }, back + 1.0);
