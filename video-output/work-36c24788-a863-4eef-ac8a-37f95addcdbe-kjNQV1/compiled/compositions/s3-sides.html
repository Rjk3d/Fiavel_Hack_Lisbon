  <script>
    (() => {
      const id = "s3-sides";
      const cue = (t, e) => window.filmCue(id, t, e);
      const tl = gsap.timeline({ paused: true });
      // Show screenshot region r = [x, y, w, h] (screenshot px) in a window of width W.
      const frame = (r, W) => { const s = W / r[2]; return { scale: s, x: -r[0] * s, y: -r[1] * s }; };
      const OV = [520, 160, 1140, 640];

      // Every window is the full 1425 x 800 stage; smaller layouts are a scale of it.
      const SMALL = 860 / 1425;
      const at = (left, top) => ({ transformOrigin: "0 0", scale: SMALL, x: left - 248, y: top - 60 });
      gsap.set(["#s3-left-cam", "#s3-right-cam"], { transformOrigin: "0 0", ...frame(OV, 1425) });
      gsap.set("#s3-left", { transformOrigin: "0 0", scale: 1, x: 0, y: 0 });

      // Start where S2 ended, then split into the two parties' views.
      const split = 0.35;
      tl.to("#s3-left", { ...at(80, 190), duration: 0.6, ease: "power3.inOut" }, split);
      tl.fromTo("#s3-right", { ...at(1100, 190), opacity: 0 }, { ...at(980, 190), opacity: 1, duration: 0.55, ease: "power3.out" }, split + 0.2);
      tl.fromTo(["#s3-who-t", "#s3-who-l"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.15 }, split + 0.5);

      // "what was agreed": the landlord's side opens into the lease page: on-chain terms and deadlines.
      const open = cue("what was agreed") - 0.3;
      const LEASE = (r) => frame(r, 1425);
      // ~1.9x punch-ins so app text stays above 26 px; the spotlight dims what the frame crops.
      const TERMS = [998, 672, 750, 421], PAID = [436, 1965, 750, 421], DUE = [436, 672, 750, 421];
      gsap.set("#s3-cam-lease", { transformOrigin: "0 0", ...LEASE(TERMS) });
      gsap.set("#s3-detail", { ...at(980, 190) });
      tl.set("#s3-detail", { opacity: 1 }, open);
      tl.to("#s3-right", { opacity: 0, duration: 0.15 }, open);
      tl.to("#s3-detail", { scale: 1, x: 0, y: 0, duration: 0.6, ease: "power3.inOut" }, open);
      tl.to(["#s3-left", "#s3-who-t", "#s3-who-l"], { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, open);

      // One spotlight per line of the voice: agreed, paid, due.
      const spot = (sel, on, off) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, on);
        tl.to(sel, { opacity: 0, duration: 0.15, ease: "power2.in" }, off);
      };
      spot("#s3-r-terms", open + 0.55, cue("what has been paid") - 0.15);
      tl.to("#s3-cam-lease", { ...LEASE(PAID), duration: 0.55, ease: "power2.inOut" }, cue("what has been paid") - 0.15);
      spot("#s3-r-months", cue("what has been paid") + 0.35, cue("what is due") - 0.15);
      tl.to("#s3-cam-lease", { ...LEASE(DUE), duration: 0.55, ease: "power2.inOut" }, cue("what is due") - 0.15);
      spot("#s3-r-due", cue("what is due") + 0.35, cue("and what happens") + 0.4);

      // "...when a problem arises": blur swap to the same lease at its damage claim.
      const claim = cue("and what happens") + 0.2;
      gsap.set("#s3-cam-claim", { transformOrigin: "0 0", ...LEASE([530, 1940, 1124, 632]) });
      tl.to("#s3-cam-lease", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, claim);
      tl.fromTo("#s3-cam-claim", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, claim + 0.12);
      tl.to("#s3-cam-claim", { ...LEASE([530, 1980, 1124, 632]), duration: 1.4, ease: "power2.inOut" }, claim + 0.3);
      spot("#s3-r-claim", claim + 1.0, cue("Less ambiguity") - 0.3);
      tl.to("#s3-src-a", { opacity: 0, duration: 0.15 }, claim);
      tl.to("#s3-src-b", { opacity: 1, duration: 0.2 }, claim + 0.15);

      // "Less ambiguity. More accountability.": the whole record, every step with its transaction.
      const rec = cue("Less ambiguity") - 0.2;
      gsap.set("#s3-cam-act", { transformOrigin: "0 0", ...LEASE([548, 330, 840, 472]) });
      tl.to("#s3-cam-claim", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, rec);
      tl.fromTo("#s3-cam-act", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, rec + 0.12);
      tl.to("#s3-cam-act", { ...LEASE([548, 860, 840, 472]), duration: 7, ease: "power1.inOut" }, rec + 0.8);
      tl.to("#s3-src-b", { opacity: 0, duration: 0.15 }, rec);
      tl.to("#s3-src-c", { opacity: 1, duration: 0.2 }, rec + 0.15);

      window.__timelines[id] = tl;
    })();
